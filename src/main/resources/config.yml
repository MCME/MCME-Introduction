database:
  enabled: false
  host: localhost
  port: 3306
  database: xxx
  user: xxx
  password: xxx

joinDelay: 11
reminderDuration: 100
reminderPeriod: 600

roomEnterMoveDelay: 5

# Resource-pack messages shared across all rooms. Rooms may override any of these keys locally;
# otherwise the values here are used as defaults.
rpMessages:
  messageRpWarning: '{"extra":[{"color":"red","text":"Resourcepack"}," has failed to load. Make sure you enabled your ",{"color":"aqua","text":"Server Resourcepacks"}," in the Multiplayer Menu. Rejoin and press ",{"color":"green","text":"\"Yes\""}," if you get promted to download it. "],"text":"Your "}'
  messageRpTimeout: '{"text":"Resource pack timed out. Please try /rp reset or rejoin the server."}'
  messageRpDeclined: '{"text":"You declined the resource pack. Please accept it in the Multiplayer menu to continue."}'
  messageRpFailedDownload: '{"text":"Resource pack download failed. Check your connection or try again later."}'
  messageRpFailedReload: '{"text":"Resource pack reload failed. Please rejoin to retry."}'
  messageRpInvalidUrl: '{"text":"The server sent an invalid resource pack URL. Contact a server administrator."}'

# Room positions, the first room's welcome text and the glowing-item area are NOT read from
# this file. The plugin reads them from locations.yml in its folder, which it never creates.
# A locations.yml for the hub looks like the example below. Positions are 'x y z' or
# 'x y z yaw pitch'. Each room also needs a playerLocation: where a player is placed on
# entering the room. displayEntity is optional and spawns in the room's world; its text is
# Adventure JSON, and <server_version> in it is replaced by the server's Minecraft version.
#
# itemGlow:
#   world: world
#   zoom: 0.1
#   rayRange: 5
#   rayWidth: 1.2
#   rayRepetitions: 5
#   glowColor: GOLD
#   items: []    # material names of the item-frame items that glow
#   pos1:
#     x: -4100
#     y: -50
#     z: -4400
#   pos2:
#     x: -4000
#     y: -30
#     z: -4300
# firstRoom:
#   world: world
#   pos1: -4096 -39 -4378
#   pos2: -4094 -35 -4375
#   playerLocation: <x y z yaw pitch>
#   tpTarget:
#     pos: -4099 -38 -4379 180 0
#   displayEntity:
#     pos: -4095 -38 -4377 180 0
#     text: '{"text":"Welcome to Middle-earth!","extra":[{"text":"\\nEnjoy your stay","color":"gold"}]}'
# secondRoom:
#   world: world
#   pos1: -4101 -39 -4381
#   pos2: -4098 -35 -4377
#   playerLocation: <x y z yaw pitch>
#   tpTarget:
#     pos: -4099 -39 -4372 270 0
firstRoom:
  tpTransitionComponent: '{"text":"\uE01f","font":"fade_black"}'
  tpTransitionTimes: '10 2 10'
  actionBarPeriod: 80
  actionBarDelay: 80
  messageActionBar: '{"text":"Press \"t\" for help."}'
  messageWelcome: '{"extra":[{"italic":true,"clickEvent":{"action":"open_url","value":"https://www.mcmiddleearth.com/community/help/terms/"},"text":"Termes & Rules Click Here"}," <--"],"text":""}'
  advancementKey: 'mcme:intro_first'
  advancementDisplay: '{"icon":{"id":"minecraft:stone"},"title":{"text":"Here it is, your text to show\n here just for you!"},"description":{"text":"Some Message!"},"hidden":true,"announce_to_chat":false}'
  #  cameraOverlay: "minecraft:block/stone"
  cameraOverlay: "minecraft:gui/overlay/welcome_screen"
secondRoom:
  tpTransitionComponent: '{"text":"\uE01f","font":"fade_black"}'
  tpTransitionTimes: 10 2 10
